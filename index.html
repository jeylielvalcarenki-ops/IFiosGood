 n.setores=(old.setores||n.setores).map(x=>({id:x.id,nome:x.nome}));n.funcionarios=(old.funcionarios||[]).map(x=>({id:x.id,nome:x.nome,setorId:x.setor,telefone:x.telefone,cargo:x.cargo,endereco:x.endereco}));n.clientes=(old.clientes||[]).map(x=>({id:x.id,nome:x.nome,telefone:x.telefone,endereco:x.endereco}));
 const fids=new Map(),mids=new Map();let ix=0;n.insumos=[];for(const x of oldFabric){fids.set(x.id,++ix);n.insumos.push({id:ix,nome:x.nome,categoria:'Tecido',unidade:'m',estoque:num(x.estoque),minimo:num(x.minimo),consumoDia:0,prazoDias:5,custoUnit:0,descricao:x.descricao||''})}for(const x of oldMaterial){mids.set(x.id,++ix);n.insumos.push({id:ix,nome:x.nome,categoria:x.tipo||'Aviamento',unidade:'un',estoque:num(x.estoque),minimo:num(x.minimo),consumoDia:0,prazoDias:5,custoUnit:0,descricao:x.descricao||''})}
 n.pecas=(old.pecas||[]).map(x=>({id:x.id,nome:x.nome,modelo:x.modelo,descricao:x.descricao||'',estoque:num(x.estoque),minimo:num(x.minimo),preco:num(x.valor),bom:[...(x.tecidos||[]).map(y=>({insumoId:fids.get(y.id),qtd:num(y.qtd)})),...(x.materiais||[]).map(y=>({insumoId:mids.get(y.id),qtd:num(y.qtd)}))].filter(y=>y.insumoId)}));
 n.producoes=(old.producoes||[]).map(x=>({id:x.id,pecaId:x.peca,funcId:x.funcionario,quantidade:num(x.qtd),inicio:x.inicio||stamp(),fim:x.fim||'',custo:0,observacao:''}));n.desperdicios=(old.desperdicios||[]).map(x=>({id:x.id,producaoId:x.producao,descricao:x.descricao,qtd:num(x.qtd),valor:num(x.valor),data:day()}));n.pedidos=(old.pedidos||[]).map(x=>({id:x.id,clienteId:x.cliente,data:x.data||day(),status:'Confirmado',confirmadoEm:x.data||day(),observacao:x.descricao||'',itens:(x.itens||[]).map(y=>({pecaId:y.peca,qtd:num(y.qtd),preco:num(y.preco)}))}));n.movimentos=[];return n;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){let o=JSON.parse(raw);if(o&&Array.isArray(o.insumos))return o;}const legacy=localStorage.getItem(OLDKEY);if(legacy){const n=migrate(JSON.parse(legacy));localStorage.setItem(KEY,JSON.stringify(n));return n}}catch(e){console.warn('Dados locais indisponíveis',e)}return demo();}

const paths={supervisor:[['inicio','Visão geral','◫','Painel'],['estoque','Controle de estoque','▥','Operação'],['pecas','Produtos e fichas','◇','Operação'],['producao','Histórico de produção','▤','Operação'],['desperdicios','Desperdícios','◉','Operação'],['indicadores','Indicadores de produção','◷','Análises'],['rastreio','Rastreabilidade','⌕','Análises']],dono:[['inicio','Visão geral','◫','Painel'],['funcionarios','Funcionários','♙','Gestão'],['clientes','Clientes / lojas','♧','Gestão'],['vendas','Controle de vendas','▤','Comercial'],['relatorios','Relatórios comerciais','▥','Comercial'],['config','Dados e backups','⚙','Sistema']],cliente:[['catalogo','Catálogo de peças','◇','Compras'],['novo-pedido','Fazer pedido','＋','Compras'],['meus-pedidos','Meus pedidos','▤','Compras']]};

const titles={inicio:'Visão geral da operação',estoque:'Controle de estoque',pecas:'Peças e fichas técnicas',producao:'Histórico de produção',desperdicios:'Controle de desperdícios',indicadores:'Indicadores de produção',rastreio:'Rastreabilidade',funcionarios:'Funcionários e setores',clientes:'Cadastro de clientes',vendas:'Controle de vendas',relatorios:'Relatórios comerciais',catalogo:'Catálogo de produtos', 'novo-pedido':'Novo pedido', 'meus-pedidos':'Meus pedidos',config:'Dados e backups'};
function setRole(r){role=r;page=r==='cliente'?'catalogo':'inicio';filter='';render();}
function route(p){if(!allowed[role].includes(p))return;page=p;filter='';render();window.scrollTo(0,0);}
function badgeLevel(x){const p=point(x);return x.estoque<=x.minimo?'danger':x.estoque<=p?'warn':'ok'}
function point(x){return num(x.minimo)+num(x.consumoDia)*num(x.prazoDias)}
function cov(x){return num(x.consumoDia)>0?x.estoque/num(x.consumoDia):null}
function levellabel(x){return badgeLevel(x)==='danger'?'Crítico':badgeLevel(x)==='warn'?'Repor':'Adequado'}
function stockBadge(x){return `<span class="badge ${badgeLevel(x)}">● ${levellabel(x)}</span>`}
function orderQty(x){return sum((x.itens||[]).map(i=>i.qtd))}
function orderTotal(x){return sum((x.itens||[]).map(i=>num(i.qtd)*num(i.preco)))}
function prodLoss(p){return sum(db.desperdicios.filter(x=>x.producaoId===p.id).map(x=>x.qtd))}
const kpi=(title,value,sub,icon='◉',cls='')=>`<div class="card"><span class="metricicon">${icon}</span><div class="metriclabel">${es(title)}</div><div class="metric">${value}</div><div class="metricinfo ${cls}">${es(sub)}</div></div>`;
function pagehead(title,desc,actions=''){return `<div class="pagetitle"><div><h1>${es(title)}</h1><p>${es(desc)}</p></div><div class="actions">${actions}</div></div>`}
const button=(act,label,variant='primary',id='')=>`<button class="btn ${variant}" data-action="${act}" ${id?`data-id="${id}"`:''}>${label}</button>`;
function table(headers,rows){return rows.length?`<div class="datatable"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty('Nenhum registro encontrado','Cadastre um registro para começar.');}
const empty=(head,sub)=>`<div class="empty"><strong>${es(head)}</strong>${es(sub)}</div>`;
function render(){if(!allowed[role].includes(page))page=role==='cliente'?'catalogo':'inicio';el('roleSelect').value=role;const groups=new Set();el('menu').innerHTML=paths[role].map(([id,label,icon,group])=>`${groups.has(group)?'':(groups.add(group),`<div class="section-name">${group}</div>`)}<button class="navlink ${page===id?'active':''}" data-page="${id}"><span class="navicon">${icon}</span>${es(label)}</button>`).join('');
 el('storeSelectHost').innerHTML=role==='cliente'?`<div class="rolebox"><label for="shopSelect">Loja</label><select id="shopSelect" aria-label="Loja ativa">${db.clientes.map(x=>`<option value="${x.id}" ${x.id===selectedClient?'selected':''}>${es(x.nome)}</option>`).join('')}</select></div>`:'';
 text('topTitle',titles[page]);let content={inicio:overview,estoque:inventory,pecas:garments,producao:production,desperdicios:waste,indicadores:indicators,rastreio:trace,funcionarios:staff,clientes:customers,vendas:sales,relatorios:reports,catalogo:catalogue,'novo-pedido':orderForm,'meus-pedidos':myOrders,config:settings}[page];el('main').innerHTML=content();el('sidebar').classList.remove('show');refreshOrderTotal();}
function overview(){if(role==='dono')return ownerHome();const alarms=db.insumos.filter(x=>badgeLevel(x)!=='ok').sort((a,b)=>cov(a)-cov(b));const underway=db.producoes.filter(x=>!x.fim);const losses=sum(db.desperdicios.map(x=>x.valor));return `<div class="hero"><div><div class="herolead">Gestão industrial integrada</div><h1>Produção sob controle. Estoque no ritmo certo.</h1><p>Acompanhe insumos, reposições, lotes e desperdícios com informações conectadas.</p></div><div class="heroaside"><strong>${underway.length} lotes</strong><small>em andamento</small></div></div><div class="cards">${kpi('Insumos cadastrados',db.insumos.length,'Tecidos, linhas, agulhas e outros','▥')}${kpi('Itens em alerta',alarms.length,'Estoque mínimo ou ponto de reposição','⚠','alert')}${kpi('Produção concluída',fmt(sum(db.producoes.filter(x=>x.fim).map(x=>x.quantidade-prodLoss(x))),0),'Peças aprovadas em lotes fechados','◈')}${kpi('Valor desperdiçado',brl(losses),'Registros de perdas identificados','◉','alert')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h2>Prioridades de reposição</h2>${button('goto-estoque','Ver estoque','small')}</div>${table(['Insumo','Saldo','Cobertura','Reposição','Situação'],alarms.slice(0,6).map(x=>`<tr><td><strong>${es(x.nome)}</strong></td><td>${fmt(x.estoque)} ${es(x.unidade)}</td><td>${cov(x)===null?'—':fmt(cov(x),1)+' dias'}</td><td>${x.prazoDias} dias</td><td>${stockBadge(x)}</td></tr>`))}</div><div class="panel"><div class="panelhead"><h2>Últimos lotes</h2>${button('goto-producao','Ver produção','small')}</div>${table(['Lote / peça','Quantidade','Status'],db.producoes.slice().reverse().slice(0,6).map(x=>`<tr><td><strong>#${x.id}</strong><br><span class="muted mini">${es(byname('pecas',x.pecaId))}</span></td><td>${x.quantidade} un</td><td>${x.fim?'<span class="badge ok">Concluído</span>':'<span class="badge info">Em andamento</span>'}</td></tr>`))}<p class="legend">Ao finalizar um lote, o sistema deduz os materiais consumidos e acrescenta as peças aprovadas ao estoque.</p></div></div>`}
function ownerHome(){const confirmed=db.pedidos.filter(x=>x.status==='Confirmado');const pending=db.pedidos.filter(x=>x.status==='Pendente');return `<div class="hero"><div><div class="herolead">Painel administrativo</div><h1>Bem-vindo à I Fios Good.</h1><p>Visão comercial e de pessoas para apoiar as decisões do negócio.</p></div><div class="heroaside"><strong>${db.funcionarios.length}</strong><small>colaboradores cadastrados</small></div></div><div class="cards">${kpi('Vendas confirmadas',brl(sum(confirmed.map(orderTotal))),'Faturamento registrado','↗')}${kpi('Pedidos pendentes',pending.length,'Aguardando confirmação','◷','alert')}${kpi('Peças vendidas',sum(confirmed.map(orderQty)),'Em pedidos confirmados','◇')}${kpi('Lojas atendidas',db.clientes.length,'Clientes cadastrados','♙')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h2>Pedidos para análise</h2>${button('goto-vendas','Ver vendas','small')}</div>${table(['Pedido','Loja','Peças','Valor','Status'],pending.slice(0,7).map(x=>`<tr><td><strong>#${x.id}</strong></td><td>${es(byname('clientes',x.clienteId))}</td><td>${orderQty(x)}</td><td>${brl(orderTotal(x))}</td><td>${status(x.status)}</td></tr>`))}</div><div class="panel"><div class="panelhead"><h2>Equipe por setor</h2>${button('goto-funcionarios','Gerenciar','small')}</div>${table(['Setor','Colaboradores'],db.setores.map(x=>`<tr><td>${es(x.nome)}</td><td><span class="badge info">${db.funcionarios.filter(y=>y.setorId===x.id).length} pessoa(s)</span></td></tr>`))}<p class="legend">O dono pode cadastrar funcionários, lojas e confirmar vendas.</p></div></div>`}
function inventory(){const ins=db.insumos.filter(x=>`${x.nome} ${x.categoria}`.toLowerCase().includes(filter.toLowerCase()));return `${pagehead('Controle de estoque','Gerencie estoque mínimo, prazo de reposição, cobertura e movimentações.',`${button('new-insumo','+ Cadastrar insumo')}${button('new-movement','↔ Movimentar estoque','cyan')}`)}<div class="cards">${kpi('Itens monitorados',db.insumos.length,'Categorias de matéria-prima','▥')}${kpi('Estoque crítico',db.insumos.filter(x=>badgeLevel(x)==='danger').length,'Saldo no mínimo ou abaixo','⚠','alert')}${kpi('Ponto de reposição',db.insumos.filter(x=>badgeLevel(x)==='warn').length,'Planejar compra','◷','alert')}${kpi('Valor estimado',brl(sum(db.insumos.map(x=>x.estoque*x.custoUnit))),'Custo unitário × saldo','↗')}</div><div class="panel"><div class="filterbar"><h2>Insumos e parâmetros</h2><input class="search" id="filter" placeholder="Buscar por nome ou categoria..." value="${es(filter)}" aria-label="Buscar insumos"></div>${table(['Insumo','Categoria','Saldo atual','Estoque mín.','Ponto de reposição','Cobertura','Prazo','Status','Ações'],ins.map(x=>`<tr><td><strong>${es(x.nome)}</strong><br><span class="muted mini">${es(x.descricao||'—')}</span></td><td>${es(x.categoria)}</td><td><strong>${fmt(x.estoque)} ${es(x.unidade)}</strong><div class="stockbar ${badgeLevel(x)}"><span style="width:${Math.max(3,Math.min(100,Math.round(x.estoque/Math.max(1,point(x))*100)))}%"></span></div></td><td>${fmt(x.minimo)} ${es(x.unidade)}</td><td>${fmt(point(x))} ${es(x.unidade)}</td><td>${cov(x)===null?'—':fmt(cov(x),1)+' dias'}</td><td>${x.prazoDias} dias</td><td>${stockBadge(x)}</td><td class="right">${button('edit-insumo','Editar','small',x.id)}</td></tr>`))}<p class="legend">Ponto de reposição = estoque mínimo + (consumo médio diário × prazo de reposição). Cobertura = estoque atual ÷ consumo médio diário. Os indicadores dependem dos valores informados no cadastro.</p></div><div class="panel"><div class="panelhead"><h2>Últimas movimentações</h2>${button('new-movement','+ Nova movimentação','small')}</div>${table(['Data','Insumo','Tipo','Quantidade','Observação'],db.movimentos.slice().reverse().slice(0,10).map(x=>`<tr><td>${dateFmt(x.data)}</td><td>${es(byname('insumos',x.insumoId))}</td><td><span class="badge ${x.tipo==='Entrada'?'ok':'warn'}">${es(x.tipo)}</span></td><td>${fmt(x.qtd)} ${es(find('insumos',x.insumoId)?.unidade||'')}</td><td>${es(x.descricao||'—')}</td></tr>`))}</div>`}
function garments(){return `${pagehead('Peças e fichas técnicas','Cadastre produtos acabados e o consumo de insumos por unidade.',button('new-peca','+ Nova peça'))}<div class="cards">${kpi('Modelos cadastrados',db.pecas.length,'Produtos comercializados','◇')}${kpi('Peças disponíveis',sum(db.pecas.map(x=>x.estoque)),'Unidades em estoque','▣')}${kpi('Estoque baixo',db.pecas.filter(x=>x.estoque<=x.minimo).length,'Modelos com atenção','⚠','alert')}${kpi('Fichas técnicas',db.pecas.filter(x=>(x.bom||[]).length).length,'Produtos com composição','▥')}</div><div class="panel"><div class="panelhead"><h2>Catálogo interno de produtos</h2><span class="badge info">Matéria-prima relacionada por peça</span></div>${table(['Peça','Modelo','Estoque','Mínimo','Preço','Insumos usados','Ações'],db.pecas.map(x=>`<tr><td><strong>${es(x.nome)}</strong></td><td>${es(x.modelo)}</td><td>${x.estoque}</td><td>${x.minimo}</td><td><strong>${brl(x.preco)}</strong></td><td><span class="badge info">${(x.bom||[]).length} insumos</span></td><td class="right">${button('edit-peca','Editar ficha','small',x.id)}</td></tr>`))}</div><div class="panel"><h2 style="margin-bottom:13px">Como funciona a ficha técnica?</h2><p>Uma peça pode consumir vários tecidos e materiais. Por exemplo, ao finalizar um lote de camisetas, o sistema consulta os metros de malha, linhas e etiquetas previstos na ficha e realiza a baixa dos insumos.</p></div>`}
function production(){const arr=db.producoes.slice().reverse();return `${pagehead('Histórico de produção','Registre lotes, responsáveis, quantidade fabricada e gastos financeiros.',button('new-producao','+ Abrir lote'))}<div class="cards">${kpi('Lotes cadastrados',arr.length,'Histórico da fábrica','▤')}${kpi('Em andamento',arr.filter(x=>!x.fim).length,'Aguardando conclusão','◷')}${kpi('Unidades aprovadas',sum(arr.filter(x=>x.fim).map(x=>x.quantidade-prodLoss(x))),'Produção líquida concluída','◇')}${kpi('Gastos de produção',brl(sum(arr.map(x=>x.custo))),'Valores informados por lote','↗')}</div><div class="panel"><div class="panelhead"><h2>Lotes de fabricação</h2><span class="badge info">Conclusão automática do estoque</span></div>${table(['Lote','Peça','Responsável','Início','Fim','Quantidade','Custo informado','Situação','Ação'],arr.map(x=>`<tr><td><strong>#${x.id}</strong></td><td>${es(byname('pecas',x.pecaId))}</td><td>${es(byname('funcionarios',x.funcId))}</td><td>${dateFmt(x.inicio)}</td><td>${dateFmt(x.fim)}</td><td>${x.quantidade} un<br><span class="muted mini">${prodLoss(x)} perdas</span></td><td>${brl(x.custo)}</td><td>${x.fim?'<span class="badge ok">Concluído</span>':'<span class="badge info">Em andamento</span>'}</td><td class="right">${x.fim?'—':button('finish-producao','Concluir lote','small',x.id)}</td></tr>`))}</div><div class="note">Concluir um lote consome os insumos da ficha técnica para a quantidade total fabricada e adiciona ao estoque de peças apenas as unidades aprovadas (total menos desperdícios registrados).</div>`}
function waste(){const total=sum(db.desperdicios.map(x=>x.valor));return `${pagehead('Controle de desperdícios','Identifique defeitos e acompanhe o impacto em cada lote.',button('new-waste','+ Registrar perda'))}<div class="cards">${kpi('Ocorrências',db.desperdicios.length,'Perdas registradas','◉')}${kpi('Peças perdidas',sum(db.desperdicios.map(x=>x.qtd)),'Unidades não aproveitadas','◇','alert')}${kpi('Valor das perdas',brl(total),'Prejuízo declarado','↘','alert')}${kpi('Lotes impactados',new Set(db.desperdicios.map(x=>x.producaoId)).size,'Com ao menos uma perda','▤')}</div><div class="panel"><div class="panelhead"><h2>Registro de perdas</h2><span class="badge info">Vinculados ao histórico de produção</span></div>${table(['Data','Produção','Peça','Ocorrência','Unidades perdidas','Valor perdido'],db.desperdicios.slice().reverse().map(x=>{const pr=find('producoes',x.producaoId);return `<tr><td>${dateFmt(x.data)}</td><td>#${x.producaoId}</td><td>${es(byname('pecas',pr?.pecaId))}</td><td>${es(x.descricao)}</td><td>${x.qtd}</td><td><strong>${brl(x.valor)}</strong></td></tr>`}))}</div>`}
function indicators(){const grouped=db.pecas.map(p=>({p,lots:db.producoes.filter(x=>x.pecaId===p.id)}));const totalQ=sum(db.producoes.map(x=>x.quantidade));const lossQty=sum(db.desperdicios.map(x=>x.qtd));const lossVal=sum(db.desperdicios.map(x=>x.valor));return `${pagehead('Indicadores de produção','Avalie volumes, despesas e desperdícios por produto.') }<div class="cards">${kpi('Produção programada',totalQ,'Unidades em todos os lotes','▤')}${kpi('Perdas registradas',lossQty,`${totalQ?fmt(100*lossQty/totalQ,1):0}% da quantidade dos lotes`,'↘','alert')}${kpi('Gastos informados',brl(sum(db.producoes.map(x=>x.custo))),'Custos diretos declarados','↗')}${kpi('Prejuízo de desperdício',brl(lossVal),'Valor informado separadamente','◉','alert')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h2>Produção por peça</h2><span class="badge info">Quantidade fabricada</span></div>${bars(grouped.map(x=>({name:x.p.nome,value:sum(x.lots.map(v=>v.quantidade))})))}</div><div class="panel"><div class="panelhead"><h2>Desperdícios por peça</h2><span class="badge info">Valor perdido (R$)</span></div>${bars(grouped.map(x=>({name:x.p.nome,value:sum(db.desperdicios.filter(d=>x.lots.some(p=>p.id===d.producaoId)).map(d=>d.valor))})),true)}</div></div><div class="panel"><div class="panelhead"><h2>Detalhamento por modelo</h2></div>${table(['Peça','Lotes','Produzido','Desperdício','Peças aprovadas (lotes concluídos)','Custos registrados'],grouped.map(x=>{const losses=sum(db.desperdicios.filter(d=>x.lots.some(p=>p.id===d.producaoId)).map(d=>d.qtd));return `<tr><td><strong>${es(x.p.nome)}</strong></td><td>${x.lots.length}</td><td>${sum(x.lots.map(y=>y.quantidade))}</td><td>${losses}</td><td>${sum(x.lots.filter(y=>y.fim).map(y=>y.quantidade-prodLoss(y)))}</td><td>${brl(sum(x.lots.map(y=>y.custo)))}</td></tr>`}))}<p class="legend">Valores de gastos e desperdícios são registros independentes e podem conter custos sobrepostos conforme o lançamento; não são somados automaticamente.</p></div>`}
function bars(data,currency=false){const max=Math.max(1,...data.map(x=>x.value));return data.length?`<div class="chart">${data.map(x=>`<div class="chartbar"><span class="chartvalue">${currency?brl(x.value):x.value}</span><div class="chartcol" style="height:${Math.max(6,Math.round(130*x.value/max))}px"></div><div class="chartlabel" title="${es(x.name)}">${es(x.name.split(' ').slice(0,2).join(' '))}</div></div>`).join('')}</div>`:empty('Sem dados','Cadastre registros para visualizar.')}
function trace(){let orders=db.pedidos.filter(x=>x.status==='Confirmado');return `${pagehead('Rastreabilidade','Do pedido da loja à composição dos produtos vendidos.') }<div class="panel"><div class="panelhead"><h2>Cliente → pedido → peça → matéria-prima</h2><span class="badge info">Consulta por pedidos confirmados</span></div>${orders.length?orders.slice().reverse().map(o=>`<div style="border-bottom:1px solid var(--line);padding:13px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px"><strong>Pedido #${o.id} · ${es(byname('clientes',o.clienteId))}</strong><span class="badge ok">${orderQty(o)} peças · ${brl(orderTotal(o))}</span></div>${o.itens.map(i=>{const p=find('pecas',i.pecaId);return `<div style="margin:8px 0 8px 13px"><strong class="tagblue">${i.qtd}× ${es(p?.nome)}</strong><div class="mini muted" style="margin:6px 0 0 12px">${(p?.bom||[]).map(b=>{const x=find('insumos',b.insumoId);return `${es(x?.nome)}: <strong>${fmt(b.qtd*i.qtd)} ${es(x?.unidade)}</strong>`}).join(' &nbsp; · &nbsp; ')||'Ficha técnica não cadastrada'}</div></div>`}).join('')}</div>`).join(''):empty('Sem vendas confirmadas','Confirme um pedido para visualizar a rastreabilidade.')}<p class="legend">Consumo teórico calculado a partir da ficha técnica vigente; o modelo atual não armazena lotes de compra individuais nem a versão histórica da receita.</p></div>`}
function staff(){return `${pagehead('Gestão de funcionários','Cadastre colaboradores, cargos e setores da indústria.',`${button('new-funcionario','+ Funcionário')}${button('new-setor','+ Setor','cyan')}`)}<div class="cards">${kpi('Colaboradores',db.funcionarios.length,'Pessoas cadastradas','♙')}${kpi('Setores',db.setores.length,'Áreas da fábrica','▥')}${kpi('Corte',db.funcionarios.filter(x=>x.setorId===1).length,'Colaboradores no setor','◈')}${kpi('Produção por responsável',new Set(db.producoes.map(x=>x.funcId)).size,'Pessoas com lotes atribuídos','▤')}</div><div class="panel"><div class="panelhead"><h2>Equipe</h2><span class="badge info">Cadastro interno</span></div>${table(['Funcionário','Cargo','Setor','Telefone','Ações'],db.funcionarios.map(x=>`<tr><td><strong>${es(x.nome)}</strong></td><td>${es(x.cargo)}</td><td>${es(byname('setores',x.setorId))}</td><td>${es(x.telefone)}</td><td class="right">${button('edit-funcionario','Editar','small',x.id)} ${button('delete-funcionario','Excluir','small danger',x.id)}</td></tr>`))}</div><div class="panel"><div class="panelhead"><h2>Setores</h2>${button('new-setor','+ Adicionar setor','small')}</div>${table(['Setor','Pessoas'],db.setores.map(x=>`<tr><td>${es(x.nome)}</td><td>${db.funcionarios.filter(f=>f.setorId===x.id).length}</td></tr>`))}</div>`}
function customers(){return `${pagehead('Cadastro de lojas','Gerencie as lojas que podem realizar pedidos na I Fios Good.',button('new-cliente','+ Nova loja'))}<div class="panel"><div class="panelhead"><h2>Clientes cadastrados</h2><span class="badge info">Pedidos vinculados por loja</span></div>${table(['Loja','Telefone','Endereço','Pedidos','Ação'],db.clientes.map(x=>`<tr><td><strong>${es(x.nome)}</strong></td><td>${es(x.telefone)}</td><td>${es(x.endereco)}</td><td>${db.pedidos.filter(p=>p.clienteId===x.id).length}</td><td class="right">${button('edit-cliente','Editar','small',x.id)} ${button('delete-cliente','Excluir','small danger',x.id)}</td></tr>`))}</div>`}
function sales(){const confirmed=db.pedidos.filter(x=>x.status==='Confirmado');return `${pagehead('Controle de vendas','Confirme pedidos das lojas e acompanhe o faturamento.',button('goto-order','+ Registrar pedido'))}<div class="cards">${kpi('Valor confirmado',brl(sum(confirmed.map(orderTotal))),'Vendas realizadas','↗')}${kpi('Pedidos recebidos',db.pedidos.length,'Todos os status','▤')}${kpi('Aguardando análise',db.pedidos.filter(x=>x.status==='Pendente').length,'Solicitações das lojas','◷','alert')}${kpi('Peças vendidas',sum(confirmed.map(orderQty)),'Pedidos confirmados','◇')}</div><div class="panel"><div class="panelhead"><h2>Pedidos e vendas</h2><span class="badge info">Pedido mínimo: ${MIN_ORDER} peças</span></div>${table(['Nº','Loja','Data','Peças','Total','Status','Ações'],db.pedidos.slice().reverse().map(x=>`<tr><td><strong>#${x.id}</strong></td><td>${es(byname('clientes',x.clienteId))}</td><td>${dateFmt(x.data)}</td><td>${orderQty(x)}</td><td><strong>${brl(orderTotal(x))}</strong></td><td>${status(x.status)}</td><td class="right">${x.status==='Pendente'?`${button('confirm-order','Confirmar venda','small',x.id)} ${button('cancel-order','Cancelar','small danger',x.id)}`:'—'}</td></tr>`))}</div><div class="note">Os pedidos entram como <strong>pendentes</strong>. Confirmar a venda verifica as quantidades disponíveis e baixa o estoque de peças. Pedidos cancelados não geram faturamento.</div>`}
function reports(){const confirmed=db.pedidos.filter(x=>x.status==='Confirmado');const rows=db.clientes.map(c=>({c,orders:confirmed.filter(o=>o.clienteId===c.id)}));return `${pagehead('Relatórios comerciais','Vendas consolidadas por loja e produto.',button('export-json','↓ Exportar dados','cyan'))}<div class="cards">${kpi('Faturamento total',brl(sum(confirmed.map(orderTotal))),'Pedidos confirmados','↗')}${kpi('Ticket médio',brl(confirmed.length?sum(confirmed.map(orderTotal))/confirmed.length:0),'Valor por pedido','▤')}${kpi('Unidades vendidas',sum(confirmed.map(orderQty)),'Peças confirmadas','◇')}${kpi('Média por pedido',fmt(confirmed.length?sum(confirmed.map(orderQty))/confirmed.length:0,1),'Unidades por pedido','▥')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h2>Faturamento por loja</h2></div>${table(['Loja','Pedidos','Peças','Valor'],rows.map(x=>`<tr><td>${es(x.c.nome)}</td><td>${x.orders.length}</td><td>${sum(x.orders.map(orderQty))}</td><td><strong>${brl(sum(x.orders.map(orderTotal)))}</strong></td></tr>`))}</div><div class="panel"><div class="panelhead"><h2>Vendas por produto</h2></div>${table(['Peça','Unidades','Faturamento'],db.pecas.map(p=>{const lines=confirmed.flatMap(o=>o.itens).filter(i=>i.pecaId===p.id);return `<tr><td>${es(p.nome)}</td><td>${sum(lines.map(i=>i.qtd))}</td><td><strong>${brl(sum(lines.map(i=>i.qtd*i.preco)))}</strong></td></tr>`}))}</div></div>`}
function catalogue(){return `${pagehead('Catálogo I Fios Good',`Escolha as peças da nossa indústria. O pedido mínimo é de ${MIN_ORDER} unidades no total.`,button('goto-order','+ Fazer pedido'))}<div class="productgrid">${db.pecas.map((p,i)=>`<article class="product"><div class="productart">${['♧','♙','◇','▱'][i%4]}</div><div class="badge info">${es(p.modelo)}</div><h3 style="margin-top:14px">${es(p.nome)}</h3><p>${es(p.descricao||'Produção têxtil I Fios Good')}</p><div class="productprice">${brl(p.preco)}</div><div class="productfoot"><span class="mini muted">${p.estoque} peças disponíveis</span>${button('goto-order','Solicitar','small')}</div></article>`).join('')}</div>`}
function orderLine(row={}){return `<div class="orderline"><select class="search sm" data-peca aria-label="Peça do pedido" required><option value="">Selecione a peça</option>${db.pecas.map(x=>`<option value="${x.id}" ${row.pecaId===x.id?'selected':''}>${es(x.nome)} · ${brl(x.preco)}</option>`).join('')}</select><input class="search sm" type="number" data-qtd aria-label="Quantidade" min="1" step="1" value="${row.qtd||50}" required><span class="mini strong" data-subtotal>${brl(0)}</span><button class="btn small danger" data-action="remove-order-line" title="Remover linha" type="button">×</button></div>`}
function orderForm(){const customer=role==='cliente'?find('clientes',selectedClient):null;return `${pagehead('Solicitar peças',`Pedidos com no mínimo ${MIN_ORDER} unidades. O pedido será enviado para confirmação do dono.`,button('back-order','← Voltar','small'))}<div class="grid2"><div class="panel"><div class="panelhead"><h2>Itens do pedido</h2><span class="badge info">Mínimo ${MIN_ORDER} peças</span></div><form id="newOrder" data-form="order"><div class="formgrid"><label class="field full">Loja solicitante${role==='cliente'?`<input value="${es(customer?.nome)}" disabled>`:`<select name="clienteId" required>${db.clientes.map(x=>`<option value="${x.id}">${es(x.nome)}</option>`).join('')}</select>`}</label></div><div class="section-sub">Produtos e quantidades</div><div id="orderRows">${orderLine()}</div><button type="button" data-action="add-order-line" class="btn small">+ Adicionar produto</button><div class="separator"></div><label class="field">Observações do pedido<textarea class="control" name="observacao" placeholder="Ex.: mix de tamanhos, instruções de entrega..."></textarea></label><div class="modalfoot"><button type="submit" class="btn primary">Enviar pedido para análise</button></div></form></div><div><div class="panel"><div class="panelhead"><h2>Resumo do pedido</h2></div><div class="orderinfo"><div><div class="mini muted">Total de peças</div><strong id="orderQty">0</strong></div><div style="text-align:right"><div class="mini muted">Valor estimado</div><strong id="orderAmount">R$ 0,00</strong></div></div><div id="orderValidation" class="note warn" style="margin-top:14px">O pedido deve conter pelo menos 50 peças.</div><p>O envio não desconta estoque imediatamente. A confirmação da venda será feita pelo perfil Dono após verificar a disponibilidade.</p></div><div class="note">Pagamento e entrega não são processados nesta demonstração. O sistema registra o pedido e permite o acompanhamento do status.</div></div></div>`}
function myOrders(){const arr=db.pedidos.filter(x=>x.clienteId===selectedClient).slice().reverse();return `${pagehead('Meus pedidos','Acompanhe as solicitações realizadas pela sua loja.',button('goto-order','+ Novo pedido'))}<div class="cards">${kpi('Pedidos enviados',arr.length,'Histórico da loja','▤')}${kpi('Aguardando confirmação',arr.filter(x=>x.status==='Pendente').length,'Em análise','◷')}${kpi('Peças confirmadas',sum(arr.filter(x=>x.status==='Confirmado').map(orderQty)),'Unidades compradas','◇')}${kpi('Valor confirmado',brl(sum(arr.filter(x=>x.status==='Confirmado').map(orderTotal))),'Vendas registradas','↗')}</div><div class="panel"><div class="panelhead"><h2>Histórico de pedidos</h2><span class="badge info">${es(byname('clientes',selectedClient))}</span></div>${table(['Pedido','Data','Produtos','Peças','Total','Status'],arr.map(x=>`<tr><td><strong>#${x.id}</strong></td><td>${dateFmt(x.data)}</td><td>${x.itens.map(i=>`${es(byname('pecas',i.pecaId))} (${i.qtd})`).join('<br>')}</td><td>${orderQty(x)}</td><td>${brl(orderTotal(x))}</td><td>${status(x.status)}</td></tr>`))}</div>`}

function refreshOrderTotal(){if(page!=='novo-pedido')return;let qty=0,value=0;el('orderRows')?.querySelectorAll('.orderline').forEach(row=>{const p=find('pecas',row.querySelector('[data-peca]')?.value);const q=Number(row.querySelector('[data-qtd]')?.value)||0;qty+=p&&q>0?q:0;value+=p&&q>0?p.preco*q:0;row.querySelector('[data-subtotal]').textContent=p&&q>0?brl(p.preco*q):brl(0)});text('orderQty',String(qty));text('orderAmount',brl(value));if(el('orderValidation')){el('orderValidation').textContent=qty>=MIN_ORDER?`Pedido válido: ${qty} peças (${MIN_ORDER} é o mínimo).`:`Faltam ${Math.max(0,MIN_ORDER-qty)} peça(s) para atingir o pedido mínimo.`;el('orderValidation').className=qty>=MIN_ORDER?'note':'note warn';}}
function modal(title,body){el('modalhost').innerHTML=`<div class="modalback" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${es(title)}"><div class="modalhead"><h2>${es(title)}</h2><button type="button" class="close" data-action="close-modal" aria-label="Fechar">×</button></div>${body}</div></div>`}
function closeModal(){el('modalhost').innerHTML=''}
const foot=()=>`<div class="modalfoot"><button class="btn" type="button" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Salvar registro</button></div>`;
const input=(name,label,value='',type='text',extra='required')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${es(value)}" ${extra}></label>`;
const select=(name,label,options,value)=>`<label class="field">${label}<select name="${name}" required>${options.map(x=>`<option value="${x.id}" ${String(x.id)===String(value)?'selected':''}>${es(x.nome)}</option>`).join('')}</select></label>`;
function openIns(id){const x=id?find('insumos',id):null;modal(x?'Editar insumo':'Cadastrar insumo',`<form data-form="insumo" data-id="${x?.id||''}"><div class="formgrid">${input('nome','Nome do material',x?.nome)}<label class="field">Categoria<select name="categoria" required>${['Tecido','Linha','Agulha','Tinta','Aviamento','Etiqueta','Embalagem','Outro'].map(c=>`<option ${x?.categoria===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Unidade de medida<select name="unidade" required>${['m','un','L','kg'].map(u=>`<option ${x?.unidade===u?'selected':''}>${u}</option>`).join('')}</select></label>${input('custoUnit','Custo por unidade (R$)',x?.custoUnit??0,'number','required min="0" step="0.01"')}${input('estoque','Estoque atual',x?.estoque??0,'number','required min="0" step="0.01"')}${input('minimo','Estoque mínimo',x?.minimo??0,'number','required min="0" step="0.01"')}${input('consumoDia','Consumo médio por dia',x?.consumoDia??0,'number','required min="0" step="0.01"')}${input('prazoDias','Prazo de reposição (dias)',x?.prazoDias??5,'number','required min="0" step="1"')}<label class="field full">Descrição<textarea name="descricao">${es(x?.descricao||'')}</textarea></label></div><div class="note">O estoque mínimo é tratado como reserva de segurança. O ponto de reposição considera também o consumo durante o prazo de entrega.</div>${foot()}</form>`)}
function openMovement(){modal('Movimentação de estoque',`<form data-form="movement"><div class="formgrid">${select('insumoId','Insumo',db.insumos.map(x=>({id:x.id,nome:x.nome+' · '+x.estoque+' '+x.unidade})))}<label class="field">Tipo<select name="tipo"><option>Entrada</option><option>Saída</option></select></label>${input('qtd','Quantidade',1,'number','required min="0.01" step="0.01"')}<label class="field">Data<input type="date" name="data" value="${day()}" required></label><label class="field full">Motivo / observações<textarea name="descricao" placeholder="Compra, ajuste, consumo extraordinário..."></textarea></label></div>${foot()}</form>`)}
function bomLine(x={}){return `<div class="bomrow"><select data-insumo class="search sm"><option value="">Selecione um insumo</option>${db.insumos.map(i=>`<option value="${i.id}" ${i.id===x.insumoId?'selected':''}>${es(i.nome)} (${es(i.unidade)})</option>`).join('')}</select><input data-qtd type="number" class="search sm" min="0.01" step="0.01" value="${x.qtd||1}" aria-label="Consumo por peça"><button class="btn danger small" type="button" data-action="remove-bom">×</button></div>`}
function openPiece(id){const x=id?find('pecas',id):null;modal(x?'Editar peça e ficha':'Cadastrar peça',`<form data-form="peca" data-id="${x?.id||''}"><div class="formgrid">${input('nome','Nome do produto',x?.nome)}${input('modelo','Modelo / tamanho',x?.modelo)}${input('estoque','Estoque acabado (unidades)',x?.estoque??0,'number','required min="0" step="1"')}${input('minimo','Estoque mínimo (unidades)',x?.minimo??0,'number','required min="0" step="1"')}${input('preco','Preço unitário (R$)',x?.preco??0,'number','required min="0" step="0.01"')}<label class="field full">Descrição<textarea name="descricao">${es(x?.descricao||'')}</textarea></label></div><div class="section-sub">Ficha técnica · consumo por unidade fabricada</div><div id="bomRows">${(x?.bom?.length?x.bom:[{}]).map(bomLine).join('')}</div><button type="button" class="btn small cyan" data-action="add-bom">+ Adicionar insumo</button><p class="legend">Cadastre ao menos um tecido. Quantidades na unidade de medida de cada insumo.</p>${foot()}</form>`)}
function openProd(){modal('Abrir lote de produção',`<form data-form="producao"><div class="formgrid">${select('pecaId','Peça fabricada',db.pecas)}${select('funcId','Responsável',db.funcionarios)}${input('quantidade','Quantidade prevista (un)',50,'number','required min="1" step="1"')}<label class="field">Início da produção<input name="inicio" type="datetime-local" value="${stamp()}" required></label>${input('custo','Gastos registrados (R$)',0,'number','required min="0" step="0.01"')}<label class="field full">Observações<textarea name="observacao"></textarea></label></div><div class="note">O lote ficará em andamento. A baixa de insumos e entrada das peças boas acontece apenas ao concluir.</div>${foot()}</form>`)}
function openWaste(){const ongoing=db.producoes.filter(p=>!p.fim);if(!ongoing.length){toast('Abra um lote em andamento para registrar desperdício.',true);return}modal('Registrar desperdício',`<form data-form="waste"><div class="formgrid">${select('producaoId','Lote (em andamento)',ongoing.map(p=>({id:p.id,nome:'#'+p.id+' · '+byname('pecas',p.pecaId)})))}${input('qtd','Peças perdidas',1,'number','required min="1" step="1"')}${input('valor','Valor perdido (R$)',0,'number','required min="0" step="0.01"')}<label class="field">Data<input name="data" type="date" value="${day()}" required></label><label class="field full">Descrição do problema<textarea name="descricao" required></textarea></label></div><div class="note">A quantidade de perdas do lote não pode superar a quantidade total fabricada.</div>${foot()}</form>`)}
function openEmployee(id){const x=id?find('funcionarios',id):null;modal(id?'Editar funcionário':'Novo funcionário',`<form data-form="funcionario" data-id="${id||''}"><div class="formgrid">${input('nome','Nome completo',x?.nome)}${input('cargo','Cargo / função',x?.cargo)}${select('setorId','Setor',db.setores,x?.setorId)}${input('telefone','Telefone',x?.telefone)}<label class="field full">Endereço<input name="endereco" value="${es(x?.endereco||'')}" required></label></div>${foot()}</form>`)}
function openCustomer(id){const x=id?find('clientes',id):null;modal(id?'Editar loja':'Nova loja',`<form data-form="cliente" data-id="${id||''}"><div class="formgrid">${input('nome','Nome da loja',x?.nome)}${input('telefone','Telefone',x?.telefone)}<label class="field full">Endereço<input name="endereco" value="${es(x?.endereco||'')}" required></label></div>${foot()}</form>`)}
function openSector(){modal('Cadastrar setor',`<form data-form="setor"><div class="formgrid">${input('nome','Nome do setor')}</div>${foot()}</form>`)}
function toast(message,error=false){el('toasthost').innerHTML=`<div class="toast" style="${error?'background:#9e3443':''}">${es(message)}</div>`;setTimeout(()=>{if(el('toasthost'))el('toasthost').innerHTML=''},3200)}
function finishProd(id){const p=find('producoes',id),piece=find('pecas',p?.pecaId);if(!p||p.fim||!piece)return;const qty=p.quantidade;const req=(piece.bom||[]).map(b=>({item:find('insumos',b.insumoId),qtd:b.qtd*qty}));if(!req.length||!req.some(x=>x.item?.categoria==='Tecido')){toast('A peça precisa de ficha técnica com tecido cadastrado.',true);return}const shortage=req.find(x=>!x.item||x.item.estoque+0.00001<x.qtd);if(shortage){toast(`Estoque insuficiente: ${shortage.item?.nome||'insumo não encontrado'}. Precisa ${fmt(shortage.qtd)}.`,true);return}const good=qty-prodLoss(p);if(good<0){toast('As perdas excedem a produção.',true);return}if(!confirm(`Concluir lote #${id}? Consumir os insumos de ${qty} peça(s) e adicionar ${good} peça(s) boas ao estoque?`))return;
 for(const r of req){r.item.estoque=Math.round((r.item.estoque-r.qtd)*100)/100;db.movimentos.push({id:next('movimentos'),insumoId:r.item.id,tipo:'Saída',qtd:r.qtd,data:day(),descricao:`Consumo produção #${p.id}`})}piece.estoque+=good;p.fim=stamp();save();render();toast('Lote concluído e estoque atualizado.')}
function confirmOrder(id){const x=find('pedidos',id);if(!x||x.status!=='Pendente')return;const bad=x.itens.find(i=>!find('pecas',i.pecaId)||find('pecas',i.pecaId).estoque<i.qtd);if(bad){toast(`Estoque insuficiente para ${byname('pecas',bad.pecaId)}.`,true);return}if(!confirm(`Confirmar pedido #${id} como venda de ${orderQty(x)} peças por ${brl(orderTotal(x))}?`))return;for(const i of x.itens)find('pecas',i.pecaId).estoque-=i.qtd;x.status='Confirmado';x.confirmadoEm=day();save();render();toast('Venda confirmada. Peças baixadas do estoque.')}
function cancelOrder(id){const x=find('pedidos',id);if(x?.status!=='Pendente')return;if(!confirm('Cancelar este pedido?'))return;x.status='Cancelado';save();render();toast('Pedido cancelado.')}
function exportJSON(){const a=document.createElement('a'),blob=new Blob([JSON.stringify({format:'ifiosgood-local-v3',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=`I_Fios_Good_backup_${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function validateImport(x){if(x?.data)x=x.data;const keys=['insumos','pecas','producoes','desperdicios','clientes','funcionarios','setores','pedidos','movimentos'];if(!x||!keys.every(k=>Array.isArray(x[k])))throw Error('Estrutura incompatível com a versão atual.');return x}
const formNumber=(d,k)=>Number(d.get(k));
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const kind=f.dataset.form;const d=new FormData(f);const id=Number(f.dataset.id)||null;try{
 if(kind==='insumo'){if(role!=='supervisor')return;const stock=num(d.get('estoque')),min=num(d.get('minimo')),lead=formNumber(d,'prazoDias'),avg=formNumber(d,'consumoDia');if([stock,min,lead,avg,formNumber(d,'custoUnit')].some(v=>!Number.isFinite(v)||v<0)||!Number.isInteger(lead))throw Error('Informe parâmetros não negativos e prazo em dias inteiros.');let obj={nome:String(d.get('nome')).trim(),categoria:d.get('categoria'),unidade:d.get('unidade'),estoque:stock,minimo:min,consumoDia:avg,prazoDias:lead,custoUnit:formNumber(d,'custoUnit'),descricao:String(d.get('descricao')||'').trim()};if(id)Object.assign(find('insumos',id),obj);else db.insumos.push({...obj,id:next('insumos')})}
 if(kind==='movement'){if(role!=='supervisor')return;const item=find('insumos',d.get('insumoId'));const qtd=formNumber(d,'qtd');if(!item||!Number.isFinite(qtd)||qtd<=0)throw Error('Selecione um insumo e uma quantidade válida.');const tipo=d.get('tipo');if(tipo==='Saída'&&item.estoque<qtd)throw Error('Estoque insuficiente para essa saída.');item.estoque=Math.round((item.estoque+(tipo==='Entrada'?qtd:-qtd))*100)/100;db.movimentos.push({id:next('movimentos'),insumoId:item.id,tipo,qtd,data:d.get('data'),descricao:String(d.get('descricao')||'').trim()})}
 if(kind==='peca'){if(role!=='supervisor')return;const bom=[...f.querySelectorAll('.bomrow')].map(r=>({insumoId:Number(r.querySelector('[data-insumo]').value),qtd:Number(r.querySelector('[data-qtd]').value)})).filter(x=>x.insumoId);if(!bom.length||!bom.some(b=>find('insumos',b.insumoId)?.categoria==='Tecido'))throw Error('Inclua ao menos um tecido na ficha técnica.');if(bom.some(x=>!Number.isFinite(x.qtd)||x.qtd<=0)||new Set(bom.map(x=>x.insumoId)).size!==bom.length)throw Error('Consumos devem ser positivos e sem insumos duplicados.');const stock=formNumber(d,'estoque'),min=formNumber(d,'minimo'),price=formNumber(d,'preco');if([stock,min,price].some(x=>!Number.isFinite(x)||x<0)||!Number.isInteger(stock)||!Number.isInteger(min))throw Error('Estoques de peças devem ser inteiros e não negativos.');const obj={nome:String(d.get('nome')).trim(),modelo:String(d.get('modelo')).trim(),estoque:stock,minimo:min,preco:price,descricao:String(d.get('descricao')||'').trim(),bom};if(id)Object.assign(find('pecas',id),obj);else db.pecas.push({...obj,id:next('pecas')})}
 if(kind==='producao'){if(role!=='supervisor')return;const q=formNumber(d,'quantidade'),c=formNumber(d,'custo');if(!Number.isInteger(q)||q<=0||c<0||!find('pecas',d.get('pecaId'))||!find('funcionarios',d.get('funcId')))throw Error('Quantidade, custo, peça ou responsável inválidos.');db.producoes.push({id:next('producoes'),pecaId:formNumber(d,'pecaId'),funcId:formNumber(d,'funcId'),quantidade:q,inicio:d.get('inicio'),fim:'',custo:c,observacao:String(d.get('observacao')||'').trim()})}
 if(kind==='waste'){if(role!=='supervisor')return;const p=find('producoes',d.get('producaoId'));const q=formNumber(d,'qtd'),c=formNumber(d,'valor');if(!p||p.fim||!Number.isInteger(q)||q<1||!Number.isFinite(c)||c<0||q+prodLoss(p)>p.quantidade)throw Error('Perdas inválidas ou superiores ao lote em andamento.');if(!String(d.get('descricao')||'').trim())throw Error('Descreva o problema.');db.desperdicios.push({id:next('desperdicios'),producaoId:p.id,qtd:q,valor:c,descricao:String(d.get('descricao')).trim(),data:d.get('data')})}
 if(kind==='funcionario'){if(role!=='dono')return;const obj={nome:String(d.get('nome')).trim(),cargo:String(d.get('cargo')).trim(),setorId:formNumber(d,'setorId'),telefone:String(d.get('telefone')),endereco:String(d.get('endereco'))};if(!find('setores',obj.setorId))throw Error('Setor não encontrado.');if(id)Object.assign(find('funcionarios',id),obj);else db.funcionarios.push({...obj,id:next('funcionarios')})}
 if(kind==='cliente'){if(role!=='dono')return;const obj={nome:String(d.get('nome')).trim(),telefone:String(d.get('telefone')),endereco:String(d.get('endereco'))};if(id)Object.assign(find('clientes',id),obj);else db.clientes.push({...obj,id:next('clientes')});if(!find('clientes',selectedClient))selectedClient=db.clientes[0]?.id||1}
 if(kind==='setor'){if(role!=='dono')return;const nome=String(d.get('nome')).trim();if(db.setores.some(x=>x.nome.toLowerCase()===nome.toLowerCase()))throw Error('Esse setor já existe.');db.setores.push({id:next('setores'),nome})}
 if(kind==='order'){if(!['cliente','dono'].includes(role))return;const clienteId=role==='cliente'?selectedClient:formNumber(d,'clienteId');if(!find('clientes',clienteId))throw Error('Selecione uma loja válida.');const rows=[...f.querySelectorAll('.orderline')].map(r=>({pecaId:Number(r.querySelector('[data-peca]').value),qtd:Number(r.querySelector('[data-qtd]').value)}));if(rows.some(x=>!find('pecas',x.pecaId)||!Number.isInteger(x.qtd)||x.qtd<=0))throw Error('Selecione produtos e quantidades inteiras maiores que zero.');if(new Set(rows.map(x=>x.pecaId)).size!==rows.length)throw Error('Agrupe peças iguais em uma única linha.');if(sum(rows.map(x=>x.qtd))<MIN_ORDER)throw Error(`O pedido mínimo é de ${MIN_ORDER} peças no total.`);const id=Math.max(1000,...db.pedidos.map(x=>x.id))+1;db.pedidos.push({id,clienteId,data:day(),status:'Pendente',confirmadoEm:'',observacao:String(d.get('observacao')||'').trim(),itens:rows.map(x=>({...x,preco:find('pecas',x.pecaId).preco}))});page=role==='cliente'?'meus-pedidos':'vendas'}
 save();closeModal();render();toast(kind==='order'?'Pedido enviado para análise.':'Registro salvo com sucesso.');
 }catch(err){toast(err.message||'Verifique os dados preenchidos.',true)}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){route(nav.dataset.page);return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=Number(b.dataset.id)||0;
 const jobs={'toggle-menu':()=>el('sidebar').classList.toggle('show'),'close-modal':closeModal,'new-insumo':()=>openIns(),'edit-insumo':()=>openIns(id),'new-movement':openMovement,'new-peca':()=>openPiece(),'edit-peca':()=>openPiece(id),'new-producao':openProd,'finish-producao':()=>finishProd(id),'new-waste':openWaste,'new-funcionario':()=>openEmployee(),'edit-funcionario':()=>openEmployee(id),'new-cliente':()=>openCustomer(),'edit-cliente':()=>openCustomer(id),'new-setor':openSector,'confirm-order':()=>confirmOrder(id),'cancel-order':()=>cancelOrder(id),'goto-vendas':()=>route('vendas'),'goto-order':()=>route('novo-pedido'),'back-order':()=>route(role==='cliente'?'catalogo':'vendas'),'goto-producao':()=>route('producao'),'goto-estoque':()=>route('estoque'),'goto-funcionarios':()=>route('funcionarios'),'export-json':exportJSON,'reset-data':()=>{if(confirm('Restaurar os dados de demonstração? Isso substituirá todos os registros atuais.')){db=demo();selectedClient=db.clientes[0].id;save();render();toast('Dados restaurados.')}} ,'delete-funcionario':()=>{if(db.producoes.some(x=>x.funcId===id)){toast('Funcionário vinculado à produção: não pode excluir.',true);return}if(confirm('Excluir funcionário?')){db.funcionarios=db.funcionarios.filter(x=>x.id!==id);save();render();toast('Funcionário excluído.')}},'delete-cliente':()=>{if(db.pedidos.some(x=>x.clienteId===id)){toast('Loja vinculada a pedidos: não pode excluir.',true);return}if(confirm('Excluir loja?')){db.clientes=db.clientes.filter(x=>x.id!==id);selectedClient=db.clientes[0]?.id||0;save();render();toast('Loja excluída.')}},'add-bom':()=>el('bomRows').insertAdjacentHTML('beforeend',bomLine()),'remove-bom':()=>b.closest('.bomrow')?.remove(),'add-order-line':()=>{el('orderRows').insertAdjacentHTML('beforeend',orderLine());refreshOrderTotal()},'remove-order-line':()=>{if(el('orderRows').children.length>1)b.closest('.orderline')?.remove();refreshOrderTotal()},'backdrop':()=>{if(e.target===b)closeModal()}};
 const supervisorActions=['new-insumo','edit-insumo','new-movement','new-peca','edit-peca','new-producao','finish-producao','new-waste','add-bom','remove-bom'];const ownerActions=['new-funcionario','edit-funcionario','new-cliente','edit-cliente','new-setor','confirm-order','cancel-order','delete-funcionario','delete-cliente','reset-data'];if(supervisorActions.includes(action)&&role!=='supervisor')return;if(ownerActions.includes(action)&&role!=='dono')return;if(['add-order-line','remove-order-line'].includes(action)&&!['cliente','dono'].includes(role))return;
 if(jobs[action])jobs[action]();});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect')setRole(e.target.value);if(e.target.id==='shopSelect'){selectedClient=Number(e.target.value);render()}if(e.target.id==='restoreInput'){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=validateImport(JSON.parse(String(reader.result)));if(confirm('Substituir todos os registros atuais pelos dados importados?')){db=obj;selectedClient=db.clientes[0]?.id||0;save();render();toast('Backup restaurado.')}}catch(err){toast('Falha na importação: '+err.message,true)}};reader.readAsText(file)}if(e.target.matches('[data-peca],[data-qtd]'))refreshOrderTotal()});
document.addEventListener('input',e=>{if(e.target.id==='filter'){const cursor=e.target.selectionStart;filter=e.target.value;const box=e.target.closest('.panel');if(!box)return;const rows=db.insumos.filter(x=>`${x.nome} ${x.categoria}`.toLowerCase().includes(filter.toLowerCase()));const tablebody=box.querySelector('tbody');if(!tablebody)return;tablebody.querySelectorAll('tr').forEach(tr=>{const hay=tr.textContent.toLowerCase();tr.style.display=hay.includes(filter.toLowerCase())?'':'none'});if(cursor!==null)e.target.setSelectionRange(cursor,cursor)}if(e.target.matches('[data-qtd],[data-peca]'))refreshOrderTotal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
save();render();
</script>
